services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: showroom
      POSTGRES_USER: showroom
      POSTGRES_PASSWORD: showroom-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showroom -d showroom"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn showroom.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload --access-logfile -"
    environment:
      DEBUG: "1"
      SECRET_KEY: local-compose-secret-not-for-production
      DATABASE_URL: postgresql://showroom:showroom-dev-only@db:5432/showroom
      DB_SSLMODE: disable
      ALLOWED_HOSTS: localhost,127.0.0.1,.localhost,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://atelier.localhost:3000
      MARKETPLACE_WEBHOOK_SECRET: local-marketplace-secret
      PUBLIC_API_URL: http://localhost:8001
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: .
    command: sh -c "while true; do python manage.py process_outbox --limit 100; sleep 10; done"
    environment:
      DEBUG: "1"
      SECRET_KEY: local-compose-secret-not-for-production
      DATABASE_URL: postgresql://showroom:showroom-dev-only@db:5432/showroom
      DB_SSLMODE: disable
      ALLOWED_HOSTS: backend
      MARKETPLACE_WEBHOOK_SECRET: local-marketplace-secret
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8001
      DEALER_HOST_OVERRIDE: atelier.localhost
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
